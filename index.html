<!DOCTYPE html>
<!--
  FeeForge — School Fee Invoice Generator
  Developed by Syed Muhammad Tayyab
  https://github.com/Syed-Muhammad-Tayyab/FeeForge
-->
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>FeeForge — School Fee Invoice Generator</title>
  <meta name="description" content="FeeForge: generate, print and download bulk school fee vouchers (invoices) as PDF — right in your browser."/>
  <meta name="author" content="Syed Muhammad Tayyab"/>
  <meta name="theme-color" content="#2c3e50"/>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="index.css">
  <link rel="icon" href="icon.png">
</head>
<body>
<div class="container">
  <h2 class="no-print">FeeForge <small class="tagline">School Fee Invoice Generator</small></h2>
  
  <!-- Form Section -->
  <div class="form-container no-print">
    <div class="row">
      <div class="col-md-6">
        <div class="form-group">
          <label for="schoolName">School Name</label>
          <input type="text" id="schoolName" value="Rahma Public School">
        </div>
      </div>
      <div class="col-md-6">
        <div class="form-group">
          <label for="logoUpload">School Logo</label>
          <input type="file" id="logoUpload" accept="image/*">
        </div>
      </div>
    </div>
    
    <div class="row">
      <div class="col-md-6">
        <div class="form-group">
          <label for="invoiceDate">Date</label>
          <input type="date" id="invoiceDate">
        </div>
      </div>
      <div class="col-md-6">
        <div class="form-group">
          <label for="startingVoucherNo">Starting Voucher No</label>
          <input type="text" id="startingVoucherNo" value="01">
        </div>
      </div>
    </div>
    
    <div class="row">
      <div class="col-md-6">
        <div class="form-group">
          <label for="collectionAt">Collection at</label>
          <input type="text" id="collectionAt" value="Administration Office">
        </div>
      </div>
      <div class="col-md-6">
        <div class="form-group">
          <label for="month">Month</label>
          <input type="text" id="month" value="August">
        </div>
      </div>
    </div>
    
    <div class="row">
      <div class="col-md-6">
        <div class="form-group">
          <label for="validUntil">Not Valid After</label>
          <input type="date" id="validUntil">
        </div>
      </div>
    </div>
    
    <h4 style="margin-top: 20px;">Student Information</h4>
    
    <div class="row">
      <div class="col-md-6">
        <div class="form-group">
          <label for="studentNames">Student Names (one per line)</label>
          <textarea id="studentNames" rows="5"></textarea>
        </div>
      </div>
      <div class="col-md-6">
        <div class="form-group">
          <label for="fatherNames">Father Names (one per line)</label>
          <textarea id="fatherNames" rows="5"></textarea>
        </div>
      </div>
    </div>
    
    <div class="row">
      <div class="col-md-6">
        <div class="form-group">
          <label for="studentClass">Class</label>
          <input type="text" id="studentClass" value="Nursery">
        </div>
      </div>
      <div class="col-md-6">
        <div class="form-group">
          <label for="rollNo">Roll No Prefix</label>
          <input type="text" id="rollNo" placeholder="Roll No Prefix (e.g., NUR-)">
        </div>
      </div>
    </div>
    
    <h4 style="margin-top: 20px;">Fee Details</h4>
    
    <div class="row">
      <div class="col-md-6">
        <div class="form-group">
          <label for="admissionFee">Admission Fee</label>
          <input type="number" id="admissionFee" value="4500">
        </div>
      </div>
      <div class="col-md-6">
        <div class="form-group">
          <label for="tuitionFee">Tuition Fee</label>
          <input type="number" id="tuitionFee" value="2250">
        </div>
      </div>
    </div>
    
    <div class="row">
      <div class="col-md-6">
        <div class="form-group">
          <label for="securityFee">Security Fee</label>
          <input type="number" id="securityFee" value="500">
        </div>
      </div>
      <div class="col-md-6">
        <div class="form-group">
          <label for="annualCharges">Annual Charges</label>
          <input type="number" id="annualCharges" value="2500">
        </div>
      </div>
    </div>
    
    <div class="row">
      <div class="col-md-6">
        <div class="form-group">
          <label for="registrationFee">Registration Fee</label>
          <input type="number" id="registrationFee" value="1000">
        </div>
      </div>
      <div class="col-md-6">
        <div class="form-group">
          <label for="bookPack">Book Pack Amount</label>
          <input type="number" id="bookPack" value="2500">
        </div>
      </div>
    </div>
    
    <div class="row">
      <div class="col-md-6">
        <div class="form-group">
          <label for="otherCharges">Other Charges</label>
          <input type="number" id="otherCharges" value="0">
        </div>
      </div>
    </div>
    
    <div class="btn-container">
      <button class="btn btn-primary" onclick="generateInvoice()">Generate Invoice</button>
      <button class="btn btn-success" onclick="downloadPDF()">Download PDF</button>
      <button class="btn btn-dark" onclick="window.print()">Print Invoice</button>
    </div>
  </div>
  
  <!-- Invoice Preview Section -->
  <div class="preview-container">
    <div class="preview-title no-print">Invoice Preview</div>
    <div id="invoicePreview" class="invoice-container">
      <!-- Invoice copies will be generated here -->
    </div>
  </div>
</div>

<footer class="app-footer no-print">
  <strong>FeeForge</strong> &middot; Developed by <strong>Syed Muhammad Tayyab</strong>
</footer>

<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
<script src="index.js"></script>
</body>
</html>
